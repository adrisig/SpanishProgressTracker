<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>¡Vamos!</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f5ee;color:#203d35;font:16px system-ui}main{max-width:900px;margin:auto;padding:18px}header,section{padding:22px;border-radius:18px;margin-bottom:16px}header{background:#194b40;color:white}h1{font-size:42px;margin:0}section{background:white;border:1px solid #dce3da}button,input,select,textarea{font:inherit;padding:10px;border:1px solid #c9d5cd;border-radius:8px}button{background:#194b40;color:white;cursor:pointer}textarea{width:100%}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}.tile{background:#f5f7f1;padding:14px;border-radius:12px}progress{width:100%;accent-color:#42856a}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.trail{display:flex;flex-direction:column-reverse}.trailrow{display:grid;grid-template-columns:repeat(3,1fr);position:relative;min-height:145px}.trailrow:before{content:'';position:absolute;top:22px;left:16%;right:16%;border-top:4px solid #968570}.trailrow:not(:first-child):after{content:'';position:absolute;top:-123px;height:145px;width:16%;right:0;border:4px solid #968570;border-left:0;border-radius:0 40px 40px 0;pointer-events:none}.trailrow:nth-child(odd):after{right:auto;left:0;border:4px solid #968570;border-right:0;border-radius:40px 0 0 40px}.step{position:relative;background:none;color:#203d35;border:0;align-self:start;overflow-wrap:anywhere;font-size:13px;z-index:1}.dot{display:block;margin:auto auto 8px;background:#42856a;color:white;border:3px solid white;border-radius:50%;width:30px;height:30px;line-height:24px}.future .dot{background:#bbb}small{display:block;color:#64756e}header small{color:white}dialog{max-width:95vw;width:480px;border:1px solid #ccc;border-radius:16px}dialog::backdrop{background:#0006}</style><main><header><small>SPANISH PRACTICE CLUB</small><h1>¡Vamos!</h1><p>Nuestro camino hacia el español</p></header><section><strong>Vista de prueba · Local demo</strong><p>Los datos se guardan solamente en este navegador. No compartas información privada.</p><div class="row"><label>Perfil <select id="person"><option>SM</option><option>MP</option></select></label><label>Semana <input type="date" id="week"></label></div><div id="summary"></div><div id="skills" class="grid"></div></section><section><h2>Registrar práctica</h2><form id="log"><div class="row"><select id="skill"></select><input id="mins" type="number" min="1" max="1440" value="15" required aria-label="Minutos"></div><p><textarea id="note" required maxlength="200" placeholder="¿Qué practicaste hoy? (en español)"></textarea></p><p><textarea id="reflection" maxlength="500" placeholder="¿Qué aprendiste? (opcional)"></textarea></p><button>Guardar práctica</button></form></section><section><h2>Mi compañero/a</h2><div id="peer"></div><button id="cheer">👏 ¡Muy bien!</button><div id="cheers"></div></section><section><h2>Mi camino</h2><div class="row"><select id="whose"><option value="self">Mi camino</option><option value="peer">Camino de mi compañero/a</option></select><select id="view"><option value="trail">Camino</option><option value="log">Registro</option></select></div><p id="count"></p><div id="trail"></div></section><section><h2>Historial · Todas las semanas</h2><div id="history"></div><button id="export">Exportar CSV</button></section><dialog id="dialog"><div id="detail"></div><form id="commentform"><textarea id="comment" required maxlength="500" placeholder="Escribe un comentario en español"></textarea><button>Publicar comentario</button></form><p><button id="like">👏 ¡Muy bien!</button> <button id="close">Cerrar</button></p></dialog></main><script>
const $=id=>document.getElementById(id), skills=['🎧 Escuchar','🗣️ Hablar','📖 Leer','✍️ Escribir'], names=['SM','MP'];let db={logs:[],cheers:[]};try{db=JSON.parse(localStorage.getItem('vamos-sm-mp'))||db}catch{};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function monday(d){d=new Date(d);d.setDate(d.getDate()-(d.getDay()+6)%7);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}let last=monday(new Date());$('week').value=last;skills.forEach((s,i)=>$('skill').add(new Option(s,i)));const who=()=>$('person').value,week=()=>$('week').value,other=()=>names.find(n=>n!==who());function totals(p,w){return skills.map((_,i)=>db.logs.filter(x=>x.p===p&&x.w===w&&x.s===i).reduce((a,x)=>a+x.m,0))}function save(){try{localStorage.setItem('vamos-sm-mp',JSON.stringify(db))}catch{alert('No se pudo guardar en este navegador.')}render()}function tiles(t){return t.map((n,i)=>'<div class="tile"><strong>'+skills[i]+'</strong><p>'+n+' / 30 min</p><progress max="30" value="'+Math.min(n,30)+'"></progress></div>').join('')}function render(){let t=totals(who(),week());$('summary').textContent=t.reduce((a,b)=>a+b,0)+' minutos · '+Math.round(t.reduce((a,b)=>a+Math.min(b,30),0)/120*100)+'% de la meta semanal';$('skills').innerHTML=tiles(t);$('peer').innerHTML='<h3>'+other()+'</h3><div class="grid">'+tiles(totals(other(),week()))+'</div>';$('cheers').innerHTML=db.cheers.filter(x=>x.w===week()).map(x=>'<p>'+esc(x.p)+' → '+esc(x.to)+': ¡Muy bien! 👏</p>').join('');let weeks=[...new Set(db.logs.map(x=>x.w))].sort().reverse();$('history').innerHTML=weeks.map(w=>'<p>'+esc(w)+' · '+names.map(p=>p+': '+totals(p,w).reduce((a,b)=>a+b,0)+' min').join(' | ')+'</p>').join('')||'Sin registros';trail()}let active=null;function trail(){let p=$('whose').value==='self'?who():other(),entries=db.logs.filter(x=>x.p===p).sort((a,b)=>a.w.localeCompare(b.w)||a.date.localeCompare(b.date)),steps=[],sums={};for(let x of entries){steps.push(x);let t=sums[x.w]|| (sums[x.w]=[0,0,0,0]),before=t.every(n=>n>=30);t[x.s]+=x.m;if(!before&&t.every(n=>n>=30))steps.push({milestone:true,w:x.w})}$('count').textContent=entries.length+' pasos · '+steps.filter(x=>x.milestone).length+' metas semanales';function markup(x,i){if(x.future)return '<div class="step future"><span class="dot"></span>Próximo paso</div>';if(x.milestone)return '<div class="step"><span class="dot">★</span>🏁 ¡Meta cumplida!<small>'+esc(x.w)+'</small></div>';return '<button class="step" data-id="'+esc(x.id)+'"><span class="dot">'+(i+1)+'</span>'+esc(x.note.slice(0,75))+'<small>'+skills[x.s]+' · '+x.m+' min</small><small>👏 '+x.likes.length+' · 💬 '+x.comments.length+'</small>'+(x.comments.length?'<small>💬 '+esc(x.comments.at(-1).text.slice(0,65))+'</small>':'')+'</button>'}let el=$('trail');if($('view').value==='log'){el.className='';el.innerHTML=steps.map(markup).reverse().join('')||'Sin actividades'}else{steps.push({future:true},{future:true},{future:true});let rows=[];for(let i=0;i<steps.length;i+=3){let cells=steps.slice(i,i+3).map((x,j)=>markup(x,i+j));while(cells.length<3)cells.push('<div></div>');if(rows.length%2)cells.reverse();rows.push('<div class="trailrow">'+cells.join('')+'</div>')}el.className='trail';el.innerHTML=rows.join('')+'<p>Inicio · ¡Vamos!</p>'}el.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{active=b.dataset.id;detail();$('dialog').showModal()})}function detail(){let x=db.logs.find(x=>x.id===active);if(!x)return;$('detail').innerHTML='<h2>'+skills[x.s]+'</h2><p>'+esc(x.p)+' · '+x.m+' min · '+esc(x.w)+'</p><p>'+esc(x.note)+'</p><p>'+esc(x.reflection)+'</p><h3>Comentarios</h3>'+x.comments.map(c=>'<p><b>'+esc(c.p)+':</b> '+esc(c.text)+'</p>').join('');$('like').disabled=x.p===who()||x.likes.includes(who())}$('log').onsubmit=e=>{e.preventDefault();if(!$('note').value.trim())return;db.logs.push({id:crypto.randomUUID(),p:who(),w:week(),date:new Date().toISOString(),s:+$('skill').value,m:+$('mins').value,note:$('note').value.trim(),reflection:$('reflection').value,comments:[],likes:[]});$('note').value='';$('reflection').value='';save()};$('commentform').onsubmit=e=>{e.preventDefault();let x=db.logs.find(x=>x.id===active);if(x&&$('comment').value.trim()){x.comments.push({p:who(),text:$('comment').value.trim()});$('comment').value='';save();detail()}};$('like').onclick=()=>{let x=db.logs.find(x=>x.id===active);if(x&&x.p!==who()&&!x.likes.includes(who())){x.likes.push(who());save();detail()}};$('close').onclick=()=>$('dialog').close();$('cheer').onclick=()=>{db.cheers.push({p:who(),to:other(),w:week()});save()};$('person').onchange=render;$('week').onchange=()=>{$('week').value=$('week').value?monday($('week').value+'T12:00:00'):monday(new Date());render()};$('whose').onchange=trail;$('view').onchange=trail;setInterval(()=>{let n=monday(new Date());if(n!==last){if(week()===last)$('week').value=n;last=n;render()}},30000);$('export').onclick=()=>{const quote=v=>'"'+String(v??'').replace(/^[=+@-]/,"'$&").replace(/"/g,'""')+'"';let csv=[['student','week','date','skill','minutes','description','reflection','comments','kudos'],...db.logs.map(x=>[x.p,x.w,x.date,skills[x.s],x.m,x.note,x.reflection,JSON.stringify(x.comments),JSON.stringify(x.likes)])].map(r=>r.map(quote).join(',')).join('\r\n');let u=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download='vamos.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};render();
</script></html>
